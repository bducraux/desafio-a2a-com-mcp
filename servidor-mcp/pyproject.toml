[project]
name = "salas-mcp"
version = "1.0.0"
description = "Servidor MCP (Streamable HTTP, spec 2026-07-28) da Central de Salas"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "uvicorn==0.54.0",
]

[project.scripts]
salas-mcp = "salas_mcp.server:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
